<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isotope Feed</title>
  <link rel="preload" href="https://demo-styles.deno.deno.net/fonts/Moranga-Regular.woff2" as="font" type="font/woff2"
    crossorigin />
  <link rel="preload" href="https://demo-styles.deno.deno.net/fonts/Moranga-Medium.woff2" as="font" type="font/woff2"
    crossorigin />
  <link rel="preload" href="https://demo-styles.deno.deno.net/fonts/Recursive_Variable.woff2" as="font"
    type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://demo-styles.deno.deno.net/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
    const src = new EventSource('/live-reload');
    src.addEventListener('message', (e) => {
      if (e.data === 'reload') {
        src.close();
        location.reload();
      }
    });
  </script>
</head>

<body>
  <audio id="audio-player" controls
    style="position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 50%; z-index: 1000;"></audio>
  <main>
    <div class="filter-buttons" style="margin-top: 60px;">
      <span class="badge bg-primary active" data-filter="*">All</span>
      <span class="badge bg-secondary" data-filter="programming">Programming</span>
      <span class="badge bg-danger" data-filter="podcast">Podcast</span>
      <span class="badge bg-success" data-filter="knowledge">Knowledge</span>
      <span class="badge bg-dark" data-filter="news">News</span>
    </div>

    <div id="grid" class="grid">
      <div class="loading">Loading feed...</div>
    </div>
  </main>

  <script>
    const grid = document.querySelector('#grid');

    async function fetchJokes() {
      const response = await fetch('https://v2.jokeapi.dev/joke/Programming?safe-mode&amount=15');
      const data = await response.json();

      if (data.jokes) {
        return data.jokes.map(joke => ({
          type: 'joke',
          id: joke.id,
          category: joke.category,
          score: Math.floor(Math.random() * 80) + 20,
          text: joke.joke || joke.setup + ' ' + joke.delivery
        }));
      }
      return [];
    }

    async function fetchTimHarford() {
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://podcasts.files.bbci.co.uk/p02pc9tn.rss'));
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        if (data.status === 'ok' && data.items) {
          return data.items.slice(0, 7).map(item => ({
            title: item.title || '',
            link: item.link || '',
            audio: item.enclosure?.link || item.audio || ''
          }));
        }
        return [];
      } catch (e) {
        console.error('Tim Harford fetch error:', e);
        return [];
      }
    }

    async function fetchPodcast() {
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.simplecast.com/BqbsxVfO'));
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        if (data.status === 'ok' && data.items) {
          return data.items.slice(0, 7).map(item => ({
            title: item.title || '',
            link: item.link || '',
            audio: item.enclosure?.link || item.audio || ''
          }));
        }
        return [];
      } catch (e) {
        console.error('Podcast fetch error:', e);
        return [{ title: 'Failed to load podcast feed', link: '#' }];
      }
    }

    async function fetchNYTimes() {
      try {
        const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://rss.nytimes.com/services/xml/rss/nyt/World.xml'));
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        if (data.status === 'ok' && data.items) {
          return data.items.slice(0, 7).map(item => ({
            title: item.title || '',
            link: item.link || ''
          }));
        }
        return [];
      } catch (e) {
        console.error('NY Times fetch error:', e);
        return [];
      }
    }

    async function fetchStories() {
      const storyIds = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json')
        .then(r => r.json());

      const stories = await Promise.all(
        storyIds.slice(0, 12).map(id =>
          fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)
            .then(r => r.json())
        )
      );

      return stories
        .filter(s => s && s.title)
        .map(story => ({
          type: 'news',
          id: story.id,
          title: story.title,
          url: story.url,
          score: story.score || 0,
          by: story.by,
          time: story.time,
          descendants: story.descendants,
          text: story.text || ''
        }));
    }

    async function init() {
      const [stories, jokes, timHarford, podcast, nyTimes] = await Promise.all([fetchStories(), fetchJokes(), fetchTimHarford(), fetchPodcast(), fetchNYTimes()]);

      const topStories = [...stories].sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 7);

      const programmingJokes = jokes.slice(0, 7);

      const items = [];

      // Use crypto random for sorting after both promises resolve
      const rand = crypto.getRandomValues(new Uint32Array(items.length));
      items.forEach((item, i) => item.rand = rand[i]);
      items.sort((a, b) => a.rand - b.rand);

      renderTiles(items, programmingJokes, topStories, timHarford, podcast, nyTimes);
    }

    function renderTiles(items, programmingJokes = [], topStories = [], timHarford = [], podcast = [], nyTimes = []) {
      grid.innerHTML = '';

      // Add the programming tile first
      if (programmingJokes.length > 0) {
        const progTile = document.createElement('div');
        progTile.className = 'tile card programming';
        progTile.dataset.filter = 'programming';
        progTile.innerHTML = `
          <div class="card-header">
            <div class="card-title">Programming Jokes</div>
            <div class="card-badges">
              <span class="badge bg-secondary">&nbsp;</span>
              <a href="https://v2.jokeapi.dev/joke/Programming?safe-mode" target="_blank" class="source-icon" title="Data Source"><i class="bi bi-box-arrow-up-right"></i></a>
            </div>
          </div>
          <div class="card-body">
            <ul class="joke-list">
              ${programmingJokes.map(j => `<li>${j.text}</li>`).join('')}
            </ul>
          </div>
        `;
        grid.appendChild(progTile);
      }

      // Add the top stories tile
      if (topStories.length > 0) {
        const storiesTile = document.createElement('div');
        storiesTile.className = 'tile card top-stories';
        storiesTile.dataset.filter = 'programming news';
        storiesTile.innerHTML = `
          <div class="card-header">
            <div class="card-title">Hacker News</div>
            <div class="card-badges">
              <span class="badge bg-secondary">&nbsp;</span>
              <span class="badge bg-dark">&nbsp;</span>
              <a href="https://news.ycombinator.com/" target="_blank" class="source-icon" title="Data Source"><i class="bi bi-box-arrow-up-right"></i></a>
            </div>
          </div>
          <div class="card-body">
            <ul class="story-list">
              ${topStories.map(s => `
                <li>
                  <a href="${s.url || `https://news.ycombinator.com/item?id=${s.id}`}" target="_blank">
                    ${s.title}
                    <span class="external-icon">↗</span>
                  </a>
                  <span class="story-score">${s.score}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        grid.appendChild(storiesTile);
      }

      // Add the Tim Harford tile
      if (timHarford.length > 0) {
        const harfordTile = document.createElement('div');
        harfordTile.className = 'tile card tim-harford';
        harfordTile.dataset.filter = 'podcast knowledge';
        harfordTile.innerHTML = `
          <div class="card-header">
            <div class="card-title">Cautionary Tales</div>
            <div class="card-badges">
              <span class="badge bg-danger">&nbsp;</span>
              <span class="badge bg-success">&nbsp;</span>
              <a href="https://podcasts.files.bbci.co.uk/p02pc9tn.rss" target="_blank" class="source-icon" title="Data Source"><i class="bi bi-box-arrow-up-right"></i></a>
            </div>
          </div>
          <div class="card-body">
            <ul class="story-list">
              ${timHarford.map((s, i) => `
                <li>
                  <a href="${s.link}" target="_blank">
                    ${s.title}
                    <span class="external-icon">↗</span>
                  </a>
                  ${s.audio ? `<button class="play-btn" data-audio="${s.audio}" data-index="${i}"><i class="bi bi-play-circle-fill"></i></button>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        grid.appendChild(harfordTile);
      }

      // Add the Podcast tile
      if (podcast.length > 0) {
        const podcastTile = document.createElement('div');
        podcastTile.className = 'tile card podcast';
        podcastTile.dataset.filter = 'podcast';
        podcastTile.innerHTML = `
          <div class="card-header">
            <div class="card-title">99% Invisible</div>
            <div class="card-badges">
              <span class="badge bg-danger">&nbsp;</span>
              <a href="https://feeds.simplecast.com/BqbsxVfO" target="_blank" class="source-icon" title="Data Source"><i class="bi bi-box-arrow-up-right"></i></a>
            </div>
          </div>
          <div class="card-body">
            <ul class="story-list">
              ${podcast.map((s, i) => `
                <li>
                  <a href="${s.link}" target="_blank">
                    ${s.title}
                    <span class="external-icon">↗</span>
                  </a>
                  ${s.audio ? `<button class="play-btn podcast-play" data-audio="${s.audio}" data-index="${i}"><i class="bi bi-play-circle-fill"></i></button>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        grid.appendChild(podcastTile);
      }

      // Add the NY Times tile
      if (nyTimes.length > 0) {
        const nyTile = document.createElement('div');
        nyTile.className = 'tile card ny-times';
        nyTile.dataset.filter = 'news';
        nyTile.innerHTML = `
          <div class="card-header">
            <div class="card-title">NY Times World</div>
            <div class="card-badges">
              <span class="badge bg-dark">&nbsp;</span>
              <a href="https://rss.nytimes.com/services/xml/rss/nyt/World.xml" target="_blank" class="source-icon" title="Data Source"><i class="bi bi-box-arrow-up-right"></i></a>
            </div>
          </div>
          <div class="card-body">
            <ul class="story-list">
              ${nyTimes.map(s => `
                <li>
                  <a href="${s.link}" target="_blank">
                    ${s.title}
                    <span class="external-icon">↗</span>
                  </a>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        grid.appendChild(nyTile);
      }
    }

    document.querySelectorAll('.badge').forEach(badge => {
      badge.addEventListener('click', () => {
        document.querySelectorAll('.badge').forEach(b => b.classList.remove('active'));
        badge.classList.add('active');

        const filter = badge.dataset.filter;
        document.querySelectorAll('.tile').forEach(tile => {
          const matchesFilter = filter === '*' || tile.dataset.filter.includes(filter);
          tile.classList.toggle('hidden', !matchesFilter);
        });
      });
    });

    const audioPlayer = document.getElementById('audio-player');

    document.addEventListener('click', (e) => {
      const playBtn = e.target.closest('.play-btn');
      if (playBtn) {
        e.preventDefault();
        e.stopPropagation();
        const audioSrc = playBtn.dataset.audio;
        if (audioPlayer.src === audioSrc && !audioPlayer.paused) {
          audioPlayer.pause();
          playBtn.innerHTML = '<i class="bi bi-play-circle-fill"></i>';
        } else {
          audioPlayer.src = audioSrc;
          audioPlayer.play();
          document.querySelectorAll('.play-btn').forEach(btn => btn.innerHTML = '<i class="bi bi-play-circle-fill"></i>');
          playBtn.innerHTML = '<i class="bi bi-pause-circle-fill"></i>';
        }
      }
    });

    audioPlayer.addEventListener('pause', () => {
      document.querySelectorAll('.play-btn').forEach(btn => btn.innerHTML = '<i class="bi bi-play-circle-fill"></i>');
    });

    init();
  </script>
</body>

</html>
